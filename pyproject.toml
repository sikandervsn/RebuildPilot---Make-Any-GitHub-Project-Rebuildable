[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rebuildpilot"
version = "0.1.0"
description = "Inspect projects for reproducibility risks and produce actionable reports."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7,<3",
    "typer>=0.16,<1",
]

[project.optional-dependencies]
desktop = [
    "PySide6>=6.7,<7",
]

[project.scripts]
rebuildpilot = "rebuildpilot.cli:app"
rebuildpilot-desktop = "rebuildpilot.desktop:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
addopts = "-q"
