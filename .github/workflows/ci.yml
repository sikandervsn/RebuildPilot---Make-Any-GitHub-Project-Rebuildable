name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Install package
        run: python -m pip install --no-build-isolation --no-deps .
      - name: Run tests
        run: python -m pytest
      - name: Smoke-test CLI
        run: python -m rebuildpilot --help
      - name: Validate healthy fixture
        run: python -m rebuildpilot validate tests/fixtures/healthy-project --format json
      - name: Build Docker image
        run: docker build --tag rebuildpilot:ci .
